<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>

    <style>
        /* Remove default spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Navbar */
        nav {
            background-color: #1e2a5a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 40px;
        }

        /* Logo */
        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        /* Navigation links */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 17px;
        }

        /* Hover effect */
        .nav-links a:hover {
            color: #ffd700;
        }

        /* Responsive design */
        @media (max-width: 768px) {

            nav {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }

            .nav-links {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            MyWebsite
        </div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

    </nav>

</body>
</html>
