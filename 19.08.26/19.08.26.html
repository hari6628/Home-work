<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>

    <style>
        .box {
            width: 250px;             
            height: 100px;            

            padding: 30px;             

            border: 5px solid black; 

            margin: 50px;             

            background-color: lightblue;
        }
    </style>
</head>

<body>

    <div class="box">
        This is the content of the box.
    </div>

</body>
</html>
